spring.application.name=course-service
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# MySQL is the production/local runtime database. Every value can be overridden
# through an environment variable without changing this committed file.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${COURSE_DB_NAME:course_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${COURSE_DB_USERNAME:root}
spring.datasource.password=${COURSE_DB_PASSWORD:12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Keep list endpoints bounded while still supporting page, size and sort params.
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# Must be identical to auth-service and registration-service.
jwt.secret=${JWT_SECRET:CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te}

# Server port
server.port=8082

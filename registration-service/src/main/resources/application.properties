spring.application.name=registration-service
server.port=8083
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:registration_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345678}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

course-service.base-url=${COURSE_SERVICE_BASE_URL:http://localhost:8082}
course-service.connect-timeout=${COURSE_SERVICE_CONNECT_TIMEOUT:3s}
course-service.read-timeout=${COURSE_SERVICE_READ_TIMEOUT:5s}

# This value must match auth-service and course-service. Override JWT_SECRET outside the classroom.
jwt.secret=${JWT_SECRET:CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te}
